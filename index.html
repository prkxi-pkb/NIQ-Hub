<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NIQ Resource Hub</title><link rel="stylesheet" href="/src/style.css"></head>
<body><aside><a class="brand" href="/">NIQ<span>RESOURCE HUB</span></a><p class="nav-label">WORKSPACE</p><nav aria-label="Main navigation"><button data-view="overview" class="active">◈ Overview</button><button data-view="programs">▦ Programs</button><button data-view="tasks">✓ Daily tasks</button><button data-view="resources">▤ Resource library</button></nav><div class="aside-footer">Your daily operating space<br><small>Personal workspace · Stored on this browser</small></div></aside>
